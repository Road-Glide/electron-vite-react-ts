name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Scaffold smoke test
        run: |
          rm -rf tmp-create-test
          node ./bin/create-electron-vite-react-ts.js tmp-create-test
          test -f tmp-create-test/package.json
          rm -rf tmp-create-test
